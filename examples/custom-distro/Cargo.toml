[package]
name = "custom-distro"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[lints]
workspace = true

[features]
# Lets the tests drive the binary with scripted model replies.
test-support = ["azazel-cli/test-support"]

[dependencies]
async-trait.workspace = true
azazel-agent.workspace = true
azazel-cli.workspace = true
azazel-core.workspace = true
serde_json.workspace = true
tokio.workspace = true

[dev-dependencies]
assert_cmd.workspace = true
# The binary the tests run is built with the scripted model provider.
azazel-cli = { workspace = true, features = ["test-support"] }
tempfile.workspace = true
