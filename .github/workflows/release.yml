name: release

# Pushing a tag such as v0.2.0 builds every platform and publishes a GitHub release with
# azazel-<os>-<arch>.(zip|tar.gz) and a .sha256 beside each. The install scripts and
# `azazel update` download from the latest release by these names.
#
# Every platform builds on GitHub's runners. The release is published once the builds are over,
# with whatever archives were uploaded, so a platform whose build failed can be added later by
# re-running the failed jobs (`gh run rerun <run id> --failed`): every step can run again on an
# existing release.
#
# Two other ways to run it publish nothing:
# - By hand (`gh workflow run release --ref <branch> -f dry_run=true`): builds every platform and
#   keeps the archives as workflow artifacts. Use it to try a change to this file or to the build.
# - A push to main that changes the lockfile, the toolchain or this file: builds only to fill the
#   dependency cache. A tag can read caches made on main, but not those made on another tag, so
#   without these runs every release would compile every dependency again.
on:
  push:
    tags: ["v*"]
    branches: [main]
    paths: [Cargo.toml, Cargo.lock, rust-toolchain.toml, .cargo/**, .github/workflows/release.yml]
  workflow_dispatch:
    inputs:
      dry_run:
        description: Build every platform and keep the archives as artifacts (a manual run never publishes)
        type: boolean
        default: true

permissions:
  contents: write

defaults:
  run:
    shell: bash

jobs:
  create:
    if: ${{ github.ref_type == 'tag' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check the tag matches the crate version
        run: |
          version=$(grep -m1 '^version = ' Cargo.toml | cut -d '"' -f 2)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "tag $GITHUB_REF_NAME does not match version $version in Cargo.toml" >&2
            exit 1
          fi
      - name: Take the release notes from CHANGELOG.md
        run: |
          version="${GITHUB_REF_NAME#v}"
          # The version's section, without its heading, up to the next section or link footer.
          awk -v v="$version" '
            index($0, "## [" v "]") == 1 { on = 1; next }
            on && (/^## \[/ || /^\[/) { exit }
            on { print }
          ' CHANGELOG.md > notes.md
          if ! grep -q '[^[:space:]]' notes.md; then
            echo "CHANGELOG.md has no section for $version" >&2
            exit 1
          fi
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file notes.md --draft
          fi

  # The web page of `azazel remote`, built once: every platform embeds the same files.
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      # Keep in step with `packageManager` in web/package.json.
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - run: bun run build
      - uses: actions/upload-artifact@v4
        with:
          name: web-build
          path: web/build
          if-no-files-found: error

  build:
    needs: [create, web]
    # `create` is skipped outside a tag; a failed one stops the builds as before.
    if: ${{ !cancelled() && needs.web.result == 'success' && needs.create.result != 'failure' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            target: x86_64-pc-windows-msvc
          - runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - runner: macos-latest
            target: aarch64-apple-darwin
          # The Intel runner builds natively and in parallel with the arm one; before, this target
          # was cross-compiled on an arm runner, the slowest job of the release.
          - runner: macos-15-intel
            target: x86_64-apple-darwin
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      # `cargo xtask dist` refuses to build the `remote` feature without it.
      - uses: actions/download-artifact@v4
        with:
          name: web-build
          path: web/build
      - run: rustup show && rustup target add ${{ matrix.target }}
      # Caches the compiled dependencies (not the workspace's own crates, which change every
      # release) of this target. Saved by runs on main and by manual runs, restored by all.
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: release-${{ matrix.target }}
          cache-targets: true
          save-if: ${{ github.ref_type != 'tag' }}
      # Screen capture (the `screen` feature) links against these on Linux.
      - if: runner.os == 'Linux'
        run: >
          sudo apt-get update && sudo apt-get install -y pkg-config libclang-dev libxcb1-dev
          libxrandr-dev libdbus-1-dev libpipewire-0.3-dev libwayland-dev libegl-dev libgbm-dev
      - run: cargo xtask dist --target ${{ matrix.target }}
      - name: Upload to the release
        if: ${{ github.ref_type == 'tag' }}
        env:
          GH_TOKEN: ${{ github.token }}
        # One archive and its checksum per job; the glob for the other archive kind matches nothing.
        run: gh release upload "$GITHUB_REF_NAME" $(ls dist/azazel-*.zip dist/azazel-*.tar.gz dist/*.sha256 2>/dev/null) --clobber
      - name: Keep the archive (manual run)
        if: ${{ github.event_name == 'workflow_dispatch' }}
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.target }}
          path: |
            dist/azazel-*.zip
            dist/azazel-*.tar.gz
            dist/*.sha256
          if-no-files-found: error
          retention-days: 3

  publish:
    needs: [create, build]
    # Also when a platform's build failed or never started: its archive is added by a re-run.
    if: ${{ !cancelled() && github.ref_type == 'tag' && needs.create.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft=false --latest
