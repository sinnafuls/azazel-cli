name: ci

# Every push to main, every pull request and every release tag is checked on Linux. Runs started by
# hand (Actions tab, or `gh workflow run ci`) check Windows and macOS as well; the release workflow
# builds every platform anyway.
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

# Pull requests from forks get a read-only token and no secrets.
permissions:
  contents: read

# A newer push to the same branch replaces the run still going for an older one.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# The Linux packages screen capture (the `screen` feature) links against; every Rust job on Linux
# installs them.
env:
  LINUX_PACKAGES: >-
    pkg-config libclang-dev libxcb1-dev libxrandr-dev libdbus-1-dev libpipewire-0.3-dev
    libwayland-dev libegl-dev libgbm-dev

jobs:
  # The web page of `azazel remote`: its checks and its unit tests. The jobs that need the built page
  # build it themselves, so none of them waits for this one.
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      # Keep in step with `packageManager` in web/package.json.
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      # The protocol types of the page come from docs/rpc.schema.json; a stale file fails here.
      - run: bun run gen:types
      - run: git diff --exit-code -- .
      - run: bun run check
      - run: bun run lint
      - run: bun run test
      - run: bun run build

  # On Linux, clippy and the tests run on runners of their own, beside each other; on Windows and
  # macOS (runs started by hand) one job does both. The Rust tests need no built web page: without
  # it the placeholder page is embedded, which is all the tests of `azazel-remote` ask for.
  check:
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(github.event_name == 'workflow_dispatch' && '[{"os":"ubuntu-latest","task":"clippy"},{"os":"ubuntu-latest","task":"test"},{"os":"windows-latest","task":"all"},{"os":"macos-latest","task":"all"}]' || '[{"os":"ubuntu-latest","task":"clippy"},{"os":"ubuntu-latest","task":"test"}]') }}
    name: check (${{ matrix.os }}, ${{ matrix.task }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    defaults:
      run:
        shell: bash
    env:
      # Debug info for every test binary of the workspace does not fit on the Linux runner's
      # disk; failures still name the test and the line.
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
    steps:
      - uses: actions/checkout@v4
      # target/ goes on the runner's second disk (/mnt) when it has room; otherwise the toolchains
      # this build never uses are deleted (about 20 GB, two minutes, beside the steps below; the
      # tests wait for it). After the checkout, which would clean a directory mounted before it.
      # The packages screen capture (the `screen` feature) links against are installed beside the
      # steps below, without recommended packages and without rebuilding the man page index.
      - if: runner.os == 'Linux'
        run: |
          free=$(df --output=avail -BG /mnt 2>/dev/null | tail -1 | tr -dc 0-9)
          echo "free on /mnt: ${free:-0} GB"; df -h / /mnt || true
          if [ "${free:-0}" -ge 25 ]; then
            sudo mkdir -p /mnt/target && sudo chown "$USER" /mnt/target
            mkdir -p "$GITHUB_WORKSPACE/target" && sudo mount --bind /mnt/target "$GITHUB_WORKSPACE/target"
            touch "$RUNNER_TEMP/disk-freed"
          else
            (sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
             touch "$RUNNER_TEMP/disk-freed") > /dev/null 2>&1 &
          fi
          (echo 'set man-db/auto-update false' | sudo debconf-communicate
           sudo dpkg-reconfigure man-db
           sudo apt-get update -q && sudo apt-get install -y -q --no-install-recommends $LINUX_PACKAGES
           echo $? > "$RUNNER_TEMP/apt-done") > "$RUNNER_TEMP/apt.log" 2>&1 &
      # Installs the toolchain and components pinned in rust-toolchain.toml.
      - run: rustup show
      # mold links the many test binaries in a fraction of the time ld takes.
      - if: runner.os == 'Linux'
        uses: rui314/setup-mold@v1
      # The workspace's own crates are cached too: a change rebuilds only the crates it touches and
      # those above them, not all of them (about two minutes of the test job before).
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.task }}
          cache-on-failure: true
          cache-workspace-crates: true
      - if: matrix.task != 'test'
        run: cargo fmt --check
      - if: runner.os == 'Linux'
        run: |
          while [ ! -f "$RUNNER_TEMP/apt-done" ]; do sleep 2; done
          cat "$RUNNER_TEMP/apt.log" | tail -5
          exit "$(cat "$RUNNER_TEMP/apt-done")"
      - if: matrix.task != 'test'
        run: cargo clippy --workspace --all-targets -- -D warnings
      # `azazel --ssh` through the real ssh: the runner logs in to itself with a key made for
      # this job, and the remote:: tests run through it beside the stand-in (AZAZEL_TEST_SSH).
      # Set up before the tests, so they run in the one test build instead of a second one.
      - if: matrix.task == 'test'
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          ssh-keygen -q -t ed25519 -N "" -f ~/.ssh/id_ed25519
          cat ~/.ssh/id_ed25519.pub >> ~/.ssh/authorized_keys
          chmod 600 ~/.ssh/authorized_keys
          sudo systemctl start ssh
          ssh-keyscan localhost >> ~/.ssh/known_hosts
          ssh -o BatchMode=yes localhost true
      - if: matrix.task == 'test'
        uses: taiki-e/install-action@v2
        with:
          tool: nextest
      # nextest runs every test in a process of its own, many at once. The docs check is one of
      # them (docs-check's the_docs_of_this_repository_agree_with_the_code), so it needs no build
      # of its own. nextest leaves doc examples out; `--doc` runs those. Most of the slow tests wait
      # on processes and timers rather than use a core, so it runs three tests per core.
      - if: matrix.task == 'test'
        run: |
          while [ ! -f "$RUNNER_TEMP/disk-freed" ]; do sleep 2; done
          AZAZEL_TEST_SSH=1 cargo nextest run --workspace --no-fail-fast --test-threads 12
          cargo test --workspace --doc
      - if: matrix.task == 'all'
        run: cargo test --workspace --no-fail-fast

  # Builds without any optional feature, beside the other jobs.
  no-default-features:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: rustup show
      - uses: rui314/setup-mold@v1
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: no-default-features
          cache-on-failure: true
      - run: cargo build --no-default-features -p azazel-cli

  # The binary the end-to-end tests drive: a build with the scripted provider (`test-support`) and
  # `remote`, made beside the check job so the browser tests need not wait for all of it. It builds
  # the page it embeds itself (about 20 seconds) rather than wait for the checks of the web job.
  e2e-binary:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      CARGO_PROFILE_DEV_DEBUG: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile && bun run build
        working-directory: web
      - run: rustup show
      - uses: rui314/setup-mold@v1
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: e2e-binary
          cache-on-failure: true
      - run: |
          echo 'set man-db/auto-update false' | sudo debconf-communicate > /dev/null
          sudo dpkg-reconfigure man-db
          sudo apt-get update -q && sudo apt-get install -y -q --no-install-recommends $LINUX_PACKAGES
      - run: cargo build -p azazel-cli --features test-support,remote
      - uses: actions/upload-artifact@v4
        with:
          name: azazel-test-binary
          path: target/debug/azazel
          if-no-files-found: error
          retention-days: 1

  # The browser tests: Chromium on Linux against a real `azazel remote` in front of a scripted
  # background session (tests/fixtures/scripts/web_session.json), split over four runners.
  e2e:
    needs: e2e-binary
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Split by screen size: each size of the layout tests takes about as long as all the other
    # tests together, and `--shard` split by count in file order, which gave one runner all of them.
    # The last group takes every test the others do not name, so a new test always runs somewhere.
    strategy:
      fail-fast: false
      matrix:
        include:
          - group: 1920x1080
            grep: 'at (1920x1080|724x1360),'
          - group: 1440x900-zoom200
            grep: 'at 1440x900-zoom200,'
          - group: 1440x900
            grep: 'at 1440x900,'
          - group: 390x844
            grep: 'at 390x844,'
          - group: 768x1024
            grep: 'at (768x1024|1024x1360),'
          - group: 1024x768
            grep: 'at 1024x768,'
          - group: rest
            grep-invert: 'at (1920x1080|724x1360|1440x900-zoom200|1440x900|390x844|768x1024|1024x1360|1024x768),'
    name: e2e (${{ matrix.group }})
    defaults:
      run:
        shell: bash
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: azazel-test-binary
          path: ${{ runner.temp }}/azazel-bin
      - run: chmod +x "$RUNNER_TEMP/azazel-bin/azazel"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      # The browser is cached; its system libraries are installed every time (they are not cached).
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('web/bun.lock') }}
      - run: bunx playwright install --with-deps chromium
      - run: |
          if [ -n "$GREP" ]; then bun run test:e2e --grep "$GREP"
          else bun run test:e2e --grep-invert "$GREP_INVERT"; fi
        env:
          AZAZEL_BIN: ${{ runner.temp }}/azazel-bin/azazel
          GREP: ${{ matrix.grep }}
          GREP_INVERT: ${{ matrix.grep-invert }}
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ matrix.group }}
          path: |
            web/playwright-report
            web/test-results
          retention-days: 7
