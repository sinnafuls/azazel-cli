name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      # Installs the toolchain and components pinned in rust-toolchain.toml.
      - run: rustup show
      # Screen capture (the `screen` feature) links against these on Linux.
      - if: runner.os == 'Linux'
        run: >
          sudo apt-get update && sudo apt-get install -y pkg-config libclang-dev libxcb1-dev
          libxrandr-dev libdbus-1-dev libpipewire-0.3-dev libwayland-dev libegl-dev
      - run: cargo fmt --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - run: cargo build --no-default-features -p azazel-cli
