name: ci

# Every push to main and every pull request is checked on Linux. Release tags, and runs started
# by hand (Actions tab, or `gh workflow run ci`), check Windows and macOS as well.
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

# Pull requests from forks get a read-only token and no secrets.
permissions:
  contents: read

# A newer push to the same branch replaces the run still going for an older one.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: ${{ (startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch') && fromJSON('["ubuntu-latest", "windows-latest", "macos-latest"]') || fromJSON('["ubuntu-latest"]') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    defaults:
      run:
        shell: bash
    env:
      # Debug info for every test binary of the workspace does not fit on the Linux runner's
      # disk; failures still name the test and the line.
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
    steps:
      # The Linux runner ships toolchains this build never uses; removing them frees about 20 GB.
      - if: runner.os == 'Linux'
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
      - uses: actions/checkout@v4
      # Installs the toolchain and components pinned in rust-toolchain.toml.
      - run: rustup show
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      # Screen capture (the `screen` feature) links against these on Linux.
      - if: runner.os == 'Linux'
        run: >
          sudo apt-get update && sudo apt-get install -y pkg-config libclang-dev libxcb1-dev
          libxrandr-dev libdbus-1-dev libpipewire-0.3-dev libwayland-dev libegl-dev libgbm-dev
      - run: cargo fmt --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace --no-fail-fast
      # The docs list what the code registers, name for name. The check is the same on every
      # system, so it runs on Linux only.
      - if: runner.os == 'Linux'
        run: cargo xtask docs-check
      # `azazel --ssh` through the real ssh: the runner logs in to itself with a key made for
      # this job. Everywhere else the same tests go through a stand-in for ssh only.
      - if: runner.os == 'Linux'
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          ssh-keygen -q -t ed25519 -N "" -f ~/.ssh/id_ed25519
          cat ~/.ssh/id_ed25519.pub >> ~/.ssh/authorized_keys
          chmod 600 ~/.ssh/authorized_keys
          sudo systemctl start ssh
          ssh-keyscan localhost >> ~/.ssh/known_hosts
          ssh -o BatchMode=yes localhost true
          AZAZEL_TEST_SSH=1 cargo test -p azazel-cli --test remote
      - run: cargo build --no-default-features -p azazel-cli
