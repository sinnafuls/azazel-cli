name: ci

# Every push to main, every pull request and every release tag is checked on Linux. Runs started by
# hand (Actions tab, or `gh workflow run ci`) check Windows and macOS as well; the release workflow
# builds every platform anyway.
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

# Pull requests from forks get a read-only token and no secrets.
permissions:
  contents: read

# A newer push to the same branch replaces the run still going for an older one.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The web page of `azazel remote`. Its build is embedded into the Rust build below (the check job)
  # and is what the end-to-end tests of the e2e job open in a browser.
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      # Keep in step with `packageManager` in web/package.json.
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      # The protocol types of the page come from docs/rpc.schema.json; a stale file fails here.
      - run: bun run gen:types
      - run: git diff --exit-code -- .
      - run: bun run check
      - run: bun run lint
      - run: bun run test
      - run: bun run build
      - uses: actions/upload-artifact@v4
        with:
          name: web-build
          path: web/build
          if-no-files-found: error
          retention-days: 7

  check:
    needs: web
    strategy:
      fail-fast: false
      matrix:
        os: ${{ github.event_name == 'workflow_dispatch' && fromJSON('["ubuntu-latest", "windows-latest", "macos-latest"]') || fromJSON('["ubuntu-latest"]') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    defaults:
      run:
        shell: bash
    env:
      # Debug info for every test binary of the workspace does not fit on the Linux runner's
      # disk; failures still name the test and the line.
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
    steps:
      # The Linux runner ships toolchains this build never uses; removing them frees about 20 GB.
      - if: runner.os == 'Linux'
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
      - uses: actions/checkout@v4
      # The page `azazel remote` serves is embedded when the crate is built: with it, the tests and
      # the binary below carry the real page, not the placeholder a checkout without it gets.
      - if: runner.os == 'Linux'
        uses: actions/download-artifact@v4
        with:
          name: web-build
          path: web/build
      # Installs the toolchain and components pinned in rust-toolchain.toml.
      - run: rustup show
      # mold links the many test binaries in a fraction of the time ld takes.
      - if: runner.os == 'Linux'
        uses: rui314/setup-mold@v1
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      # Screen capture (the `screen` feature) links against these on Linux.
      - if: runner.os == 'Linux'
        run: >
          sudo apt-get update && sudo apt-get install -y pkg-config libclang-dev libxcb1-dev
          libxrandr-dev libdbus-1-dev libpipewire-0.3-dev libwayland-dev libegl-dev libgbm-dev
      - run: cargo fmt --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      # `azazel --ssh` through the real ssh: the runner logs in to itself with a key made for
      # this job, and the remote:: tests run through it beside the stand-in (AZAZEL_TEST_SSH).
      # Set up before the tests, so they run in the one test build instead of a second one.
      - if: runner.os == 'Linux'
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          ssh-keygen -q -t ed25519 -N "" -f ~/.ssh/id_ed25519
          cat ~/.ssh/id_ed25519.pub >> ~/.ssh/authorized_keys
          chmod 600 ~/.ssh/authorized_keys
          sudo systemctl start ssh
          ssh-keyscan localhost >> ~/.ssh/known_hosts
          ssh -o BatchMode=yes localhost true
      - if: runner.os == 'Linux'
        uses: taiki-e/install-action@v2
        with:
          tool: nextest
      # nextest runs every test in a process of its own, many at once. The docs check is one of
      # them (docs-check's the_docs_of_this_repository_agree_with_the_code), so it needs no build
      # of its own. nextest leaves doc examples out; `--doc` runs those.
      - if: runner.os == 'Linux'
        run: |
          AZAZEL_TEST_SSH=1 cargo nextest run --workspace --no-fail-fast
          cargo test --workspace --doc
      - if: runner.os != 'Linux'
        run: cargo test --workspace --no-fail-fast
      # The binary the end-to-end tests drive is the one the test build above made: the integration
      # tests of azazel-cli turn on `test-support` (the scripted provider) and `remote` for it, so
      # no second build is needed. Upload it before the build below replaces it.
      - if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: azazel-test-binary
          path: target/debug/azazel
          if-no-files-found: error
          retention-days: 1
      - run: cargo build --no-default-features -p azazel-cli

  # The browser tests: Chromium on Linux against a real `azazel remote` in front of a scripted
  # background session (tests/fixtures/scripts/web_session.json).
  e2e:
    needs: [web, check]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: azazel-test-binary
          path: ${{ runner.temp }}/azazel-bin
      - run: chmod +x "$RUNNER_TEMP/azazel-bin/azazel"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - run: bunx playwright install --with-deps chromium
      - run: bun run test:e2e
        env:
          AZAZEL_BIN: ${{ runner.temp }}/azazel-bin/azazel
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            web/playwright-report
            web/test-results
          retention-days: 7
