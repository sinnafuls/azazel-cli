name: ci

# Windows runs on every push and pull request, on the self-hosted runner (the repository is
# private, so GitHub's runners cost Actions minutes). Linux and macOS run on GitHub's runners for
# release tags and when started by hand (Actions tab, or `gh workflow run ci`).
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

# A newer push to the same branch replaces the run still going for an older one.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: [self-hosted, azazel-windows]
    timeout-minutes: 120
    defaults:
      run:
        shell: bash
    steps:
      # The runner keeps its working copy: `target/` stays, so each run builds only what changed.
      - uses: actions/checkout@v4
        with:
          clean: false
      # Installs the toolchain and components pinned in rust-toolchain.toml.
      - run: rustup show
      - run: cargo fmt --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace --no-fail-fast
      - run: cargo build --no-default-features -p azazel-cli

  hosted:
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    env:
      # Debug info for every test binary of the workspace does not fit on the Linux runner's
      # disk; failures still name the test and the line.
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
    steps:
      # The Linux runner ships toolchains this build never uses; removing them frees about 20 GB.
      - if: runner.os == 'Linux'
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
      - uses: actions/checkout@v4
      - run: rustup show
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      # Screen capture (the `screen` feature) links against these on Linux.
      - if: runner.os == 'Linux'
        run: >
          sudo apt-get update && sudo apt-get install -y pkg-config libclang-dev libxcb1-dev
          libxrandr-dev libdbus-1-dev libpipewire-0.3-dev libwayland-dev libegl-dev libgbm-dev
      - run: cargo fmt --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace --no-fail-fast
      # `azazel --ssh` through the real ssh: the runner logs in to itself with a key made for
      # this job. Everywhere else the same tests go through a stand-in for ssh only.
      - if: runner.os == 'Linux'
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          ssh-keygen -q -t ed25519 -N "" -f ~/.ssh/id_ed25519
          cat ~/.ssh/id_ed25519.pub >> ~/.ssh/authorized_keys
          chmod 600 ~/.ssh/authorized_keys
          sudo systemctl start ssh
          ssh-keyscan localhost >> ~/.ssh/known_hosts
          ssh -o BatchMode=yes localhost true
          AZAZEL_TEST_SSH=1 cargo test -p azazel-cli --test remote
      - run: cargo build --no-default-features -p azazel-cli
