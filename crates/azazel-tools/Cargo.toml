[package]
name = "azazel-tools"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[lints]
workspace = true

[features]
# `zip` and `flate2` unpack the rust-analyzer release it installs.
lsp = ["dep:lsp-types", "dep:zip", "dep:flate2"]
pdf = ["dep:pdf-extract"]
# `.docx`, `.pptx`, `.xlsx`, `.msg` and `.eml` files in `read`.
office = ["dep:zip", "dep:cfb", "dep:mail-parser"]

[dependencies]
async-trait.workspace = true
azazel-agent.workspace = true
azazel-ai.workspace = true
azazel-core.workspace = true
base64.workspace = true
cfb = { workspace = true, optional = true }
dom_smoothie.workspace = true
flate2 = { workspace = true, optional = true }
futures.workspace = true
globset.workspace = true
grep-regex.workspace = true
grep-searcher.workspace = true
htmd.workspace = true
ignore.workspace = true
lsp-types = { workspace = true, optional = true }
mail-parser = { workspace = true, optional = true }
pdf-extract = { workspace = true, optional = true }
portable-pty.workspace = true
process-wrap.workspace = true
quick-xml.workspace = true
regex.workspace = true
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
similar.workspace = true
tokio.workspace = true
tokio-util.workspace = true
tracing.workspace = true
vt100.workspace = true
which.workspace = true
zip = { workspace = true, optional = true }

[dev-dependencies]
azazel-ai = { workspace = true, features = ["test-support"] }
image.workspace = true
tempfile.workspace = true
wiremock.workspace = true
