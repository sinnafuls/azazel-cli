[package]
name = "azazel-browser"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

# This crate does not take the workspace lints: screen capture and input need `unsafe` FFI.
[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"

[features]
screen = ["dep:enigo", "dep:image", "dep:jiff", "dep:xcap", "dep:windows-sys"]

[dependencies]
async-trait.workspace = true
azazel-agent.workspace = true
azazel-ai.workspace = true
azazel-core.workspace = true
base64.workspace = true
futures.workspace = true
enigo = { workspace = true, optional = true }
image = { workspace = true, optional = true }
jiff = { workspace = true, optional = true }
process-wrap.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tokio-tungstenite.workspace = true
tokio-util.workspace = true
tracing.workspace = true
which.workspace = true
xcap = { workspace = true, optional = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, optional = true }

[dev-dependencies]
image.workspace = true
tempfile.workspace = true
