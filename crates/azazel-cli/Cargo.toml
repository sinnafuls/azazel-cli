[package]
name = "azazel-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
authors.workspace = true
homepage.workspace = true

[lints]
workspace = true

[lib]
name = "azazel_cli"

[[bin]]
name = "azazel"
path = "src/main.rs"

[features]
default = [
    "lua",
    "mcp",
    "acp",
    "memory",
    "browser",
    "screen",
    "media",
    "lsp",
    "debug",
    "pdf",
    "office",
    "bedrock",
    "vertex",
    "voice",
    "notify",
    "images",
    "detach",
    "repomap",
    "remote",
]
lua = ["dep:azazel-lua"]
mcp = ["dep:azazel-mcp"]
acp = ["dep:agent-client-protocol"]
# `rusqlite` reads the SQLite stores of other harnesses for `azazel migrate`; the memory store
# already links it.
memory = ["dep:azazel-memory", "dep:rusqlite"]
# The repository map: `repo_map` and `/repomap`, read by a line scanner for Rust, Python, Go,
# JavaScript and TypeScript. `repomap-treesitter` reads with grammars instead, which add 5.3 MB.
repomap = ["dep:azazel-repomap"]
repomap-treesitter = ["repomap", "azazel-repomap/treesitter"]
browser = ["dep:azazel-browser"]
screen = ["browser", "azazel-browser/screen"]
media = ["dep:azazel-media"]
lsp = ["azazel-tools/lsp"]
debug = ["azazel-tools/debug"]
pdf = ["azazel-tools/pdf"]
office = ["azazel-tools/office"]
bedrock = ["azazel-ai/bedrock"]
vertex = ["azazel-ai/vertex"]
voice = ["dep:cpal", "reqwest/multipart"]
# Desktop notifications when the terminal has none of its own, and keeping the machine awake.
notify = ["dep:notify-rust", "dep:keepawake"]
# Images shown inline in terminals that can draw them.
images = ["azazel-tui/images"]
# Mermaid diagrams: drawn as inline images, and written as SVG by `/open diagram`. Not in the
# default build: the diagram renderer and what draws its SVG (with the font that ships for it)
# add 4.9 MB to the binary.
diagrams = ["images", "dep:mermaid-rs-renderer", "dep:resvg"]
# Background sessions (`azazel bg`, `ps`, `logs`, `attach`, `kill`) on local sockets.
detach = ["dep:interprocess", "dep:process-wrap", "dep:winsafe"]
# `azazel remote`: a web page and a WebSocket server that follow and steer background sessions from a
# browser or a phone.
remote = ["dep:azazel-remote", "detach"]
test-support = ["azazel-ai/test-support"]

[dependencies]
azazel-ai.workspace = true
azazel-agent.workspace = true
azazel-client.workspace = true
azazel-core.workspace = true
azazel-protocol.workspace = true
azazel-tools.workspace = true
azazel-team.workspace = true
azazel-tui.workspace = true
azazel-mcp = { workspace = true, optional = true }
azazel-memory = { workspace = true, optional = true }
azazel-repomap = { workspace = true, optional = true }
azazel-lua = { workspace = true, optional = true }
azazel-remote = { workspace = true, optional = true }
azazel-browser = { workspace = true, optional = true }
azazel-media = { workspace = true, optional = true }
agent-client-protocol = { workspace = true, optional = true }
anyhow.workspace = true
arboard.workspace = true
async-trait.workspace = true
base64.workspace = true
clap.workspace = true
clap_complete.workspace = true
crossterm.workspace = true
flate2.workspace = true
futures.workspace = true
globset.workspace = true
ignore.workspace = true
image.workspace = true
interprocess = { workspace = true, optional = true }
jiff.workspace = true
keepawake = { workspace = true, optional = true }
mermaid-rs-renderer = { workspace = true, optional = true }
mimalloc.workspace = true
notify-rust = { workspace = true, optional = true }
nucleo-matcher.workspace = true
regex.workspace = true
reqwest.workspace = true
resvg = { workspace = true, optional = true }
rusqlite = { workspace = true, optional = true }
serde.workspace = true
serde_json.workspace = true
serde_yaml_ng.workspace = true
sha2.workspace = true
tempfile.workspace = true
tokio.workspace = true
tokio-util.workspace = true
toml.workspace = true
toml_edit.workspace = true
tracing.workspace = true
tracing-appender.workspace = true
tracing-subscriber.workspace = true
uuid.workspace = true
which.workspace = true
zip.workspace = true

# Linux records and plays through external programs: linking its audio library would stop the
# binary from starting on machines without it.
[target.'cfg(any(windows, target_os = "macos"))'.dependencies]
cpal = { workspace = true, optional = true }

[target.'cfg(windows)'.dependencies]
crossterm_winapi.workspace = true
# Starts a background session without handing it this process's handles: a process started the
# usual way inherits them, and whoever reads this process's output would wait for that one too.
winsafe = { workspace = true, optional = true }

# Starts a background session in a session of its own.
[target.'cfg(unix)'.dependencies]
process-wrap = { workspace = true, optional = true }

[build-dependencies]
flate2.workspace = true
# Compiles the Windows resource (icon, file details); does nothing for other targets.
embed-resource.workspace = true

[dev-dependencies]
assert_cmd.workspace = true
# The package depends on itself so that its tests, and the `azazel` binary they drive, are built
# with the scripted mock provider, and so that the opt-in diagram drawing is tested and linted.
azazel-cli = { path = ".", features = ["test-support", "diagrams", "remote"] }
agent-client-protocol.workspace = true
dunce.workspace = true
# A terminal for the tests of what the interactive UI does before it draws.
portable-pty.workspace = true
rmcp.workspace = true
tempfile.workspace = true
tokio-tungstenite.workspace = true
# The status line as a terminal shows it.
vt100.workspace = true
wiremock.workspace = true
