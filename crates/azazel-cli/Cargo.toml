[package]
name = "azazel-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[lints]
workspace = true

[lib]
name = "azazel_cli"

[[bin]]
name = "azazel"
path = "src/main.rs"

[features]
default = [
    "lua",
    "mcp",
    "acp",
    "memory",
    "browser",
    "screen",
    "media",
    "lsp",
    "pdf",
    "bedrock",
    "vertex",
    "voice",
]
lua = ["dep:azazel-lua"]
mcp = ["dep:azazel-mcp"]
acp = ["dep:agent-client-protocol"]
memory = ["dep:azazel-memory"]
browser = ["dep:azazel-browser"]
screen = ["browser", "azazel-browser/screen"]
media = ["dep:azazel-media"]
lsp = ["azazel-tools/lsp"]
pdf = ["azazel-tools/pdf"]
bedrock = ["azazel-ai/bedrock"]
vertex = ["azazel-ai/vertex"]
voice = ["dep:cpal", "reqwest/multipart"]
test-support = ["azazel-ai/test-support"]

[dependencies]
azazel-ai.workspace = true
azazel-agent.workspace = true
azazel-core.workspace = true
azazel-protocol.workspace = true
azazel-tools.workspace = true
azazel-team.workspace = true
azazel-tui.workspace = true
azazel-mcp = { workspace = true, optional = true }
azazel-memory = { workspace = true, optional = true }
azazel-lua = { workspace = true, optional = true }
azazel-browser = { workspace = true, optional = true }
azazel-media = { workspace = true, optional = true }
agent-client-protocol = { workspace = true, optional = true }
anyhow.workspace = true
arboard.workspace = true
async-trait.workspace = true
base64.workspace = true
clap.workspace = true
clap_complete.workspace = true
crossterm.workspace = true
futures.workspace = true
ignore.workspace = true
image.workspace = true
jiff.workspace = true
mimalloc.workspace = true
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
tempfile.workspace = true
tokio.workspace = true
tokio-util.workspace = true
toml.workspace = true
toml_edit.workspace = true
tracing.workspace = true
tracing-appender.workspace = true
tracing-subscriber.workspace = true
which.workspace = true

# Linux records and plays through external programs: linking its audio library would stop the
# binary from starting on machines without it.
[target.'cfg(any(windows, target_os = "macos"))'.dependencies]
cpal = { workspace = true, optional = true }

[dev-dependencies]
assert_cmd.workspace = true
# The package depends on itself so that its tests, and the `azazel` binary they drive, are built
# with the scripted mock provider.
azazel-cli = { path = ".", features = ["test-support"] }
agent-client-protocol.workspace = true
azazel-client.workspace = true
dunce.workspace = true
rmcp.workspace = true
tempfile.workspace = true
wiremock.workspace = true
