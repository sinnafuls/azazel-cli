[workspace]
resolver = "3"
members = [
    "crates/*",
    "xtask",
    "xtask/docs-check",
    "tests/fixtures/mcp-echo",
    "tests/fixtures/fake-lsp",
    "tests/fixtures/fake-dap",
    "tests/fixtures/fake-check",
    "tests/fixtures/fake-sg",
    "tests/fixtures/fake-gh",
    "tests/fixtures/fake-npm",
    "tests/fixtures/fake-audio",
    "tests/fixtures/fake-ssh",
    "tests/fixtures/fake-sched",
    "tests/fixtures/fake-az",
    "examples/custom-distro",
    "examples/client-demo",
]

[workspace.package]
version = "0.10.1"
edition = "2024"
rust-version = "1.99"
publish = false
license = "MIT OR Apache-2.0"
repository = "https://github.com/sinnafuls/azazel-cli"

[workspace.dependencies]
# Workspace crates
azazel-ai = { path = "crates/azazel-ai" }
azazel-agent = { path = "crates/azazel-agent" }
azazel-core = { path = "crates/azazel-core" }
azazel-tools = { path = "crates/azazel-tools" }
azazel-mcp = { path = "crates/azazel-mcp" }
azazel-memory = { path = "crates/azazel-memory" }
azazel-repomap = { path = "crates/azazel-repomap" }
azazel-team = { path = "crates/azazel-team" }
azazel-lua = { path = "crates/azazel-lua" }
azazel-browser = { path = "crates/azazel-browser" }
azazel-media = { path = "crates/azazel-media" }
azazel-tui = { path = "crates/azazel-tui" }
azazel-cli = { path = "crates/azazel-cli" }
azazel-protocol = { path = "crates/azazel-protocol" }
azazel-client = { path = "crates/azazel-client" }

# Async runtime and streams
tokio = { version = "1.54", features = [
    "rt-multi-thread",
    "macros",
    "process",
    "fs",
    "io-util",
    "io-std",
    "net",
    "sync",
    "time",
    "signal",
] }
tokio-util = { version = "0.7", features = ["rt", "compat"] }
futures = "0.3"
async-trait = "0.1"

# Network. One TLS implementation, rustls on `ring`: reqwest comes without a provider of its own
# (its default, aws-lc, is a second cryptography library) and takes the one `azazel_ai::tls`
# installs, which is why clients are built there.
reqwest = { version = "0.13", default-features = false, features = [
    "json",
    "stream",
    "rustls-no-provider",
    "http2",
    "gzip",
    "system-proxy",
] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
tokio-tungstenite = { version = "0.30", features = ["connect"] }

# Serialisation
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
toml = "1.2"
serde_yaml_ng = "0.10"
schemars = "1.2"

# Errors and CLI
thiserror = "2"
anyhow = "1"
clap = { version = "4.6", features = ["derive"] }
clap_complete = "4.6"

# Terminal
crossterm = { version = "0.29", features = ["event-stream"] }
# The console input mode on Windows, for reading what the terminal answers to a query
crossterm_winapi = "0.9"
unicode-width = "0.2"
unicode-segmentation = "1"
pulldown-cmark = { version = "0.13", default-features = false }
syntect = { version = "5.3", default-features = false, features = [
    "parsing",
    "default-syntaxes",
    "default-themes",
    "regex-onig",
] }

# Search, diff, fuzzy
ignore = "0.4"
globset = "0.4"
grep-searcher = "0.1"
grep-regex = "0.1"
grep-matcher = "0.1"
similar = "3"
nucleo-matcher = "0.3"

# Typed results: no remote or file references in a schema a model wrote
jsonschema = { version = "0.61", default-features = false }

# Storage, hashing, ids, time, paths
rusqlite = { version = "0.41", features = ["bundled"] }
blake3 = "1.8"
uuid = { version = "1", features = ["v7"] }
base64 = "0.23"
jiff = "0.2"
directories = "6"
dunce = "1"
which = "8"
bytes = "1"
sha2 = "0.11"
# Unpacks npm tarballs and the data packed into the binary by the build scripts; the HTTP client
# already links it for compressed responses.
flate2 = "1.1"
rand = "0.10"

# Processes and shell parsing
process-wrap = { version = "10", features = ["tokio1"] }
# A real terminal for programs that ask questions or draw a screen (ConPTY on Windows)
portable-pty = "0.9"
# Local sockets (Unix) and named pipes (Windows) for background sessions
interprocess = { version = "2.4", features = ["tokio"] }
winsafe = { version = "0.0.29", features = ["kernel"] }
tree-sitter = "0.27"
tree-sitter-bash = "0.25"
tree-sitter-rust = "0.24"
tree-sitter-python = "0.25"
tree-sitter-go = "0.25"
tree-sitter-javascript = "0.25"
tree-sitter-typescript = "0.23"
regex = "1"
toml_edit = "0.25"

# Protocols and scripting
rmcp = { version = "3.9", default-features = false, features = [
    "client",
    "transport-child-process",
    "transport-streamable-http-client-reqwest",
    "reqwest-tls-no-provider",
    "auth",
    "elicitation",
] }
agent-client-protocol = "5.2"
mlua = { version = "0.12", features = ["luau", "async", "serialize", "send", "anyhow"] }
lsp-types = "0.97"

# Web content and media
dom_smoothie = "0.19"
htmd = "0.5"
# `bmp` only to turn what is pasted into PNG: Windows hands WSL its clipboard images that way.
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "gif", "bmp"] }
arboard = "3.7"
icy_sixel = "0.7"
# Diagrams: Mermaid to SVG, SVG to pixels. No system font scan and no image decoders in resvg.
mermaid-rs-renderer = { version = "0.3", default-features = false }
resvg = { version = "0.50", default-features = false, features = ["text"] }
# Desktop notifications and holding the machine awake while agents work
notify-rust = "4.19"
keepawake = "0.6"
pdf-extract = "0.12"
# Office and mail files for `read`: OOXML is a zip of XML, an Outlook message a compound file.
# A bug report is a zip too.
zip = { version = "9.5", default-features = false, features = ["deflate-flate2"] }
quick-xml = "0.41"
cfb = "0.16"
mail-parser = { version = "1.0", features = ["full_encoding"] }
xcap = "0.9"
cpal = "0.18"
enigo = "0.6"
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_System_Threading",
    "Win32_UI_WindowsAndMessaging",
] }

# Cloud. The AWS crates come without their default HTTPS client, which links aws-lc (and, with
# the `rustls` feature, a legacy hyper 0.14 stack): the Bedrock provider hands them the same
# client on `ring`. `aws-config` keeps the rest of its defaults.
aws-config = { version = "1.13", default-features = false, features = [
    "rt-tokio",
    "credentials-process",
    "sso",
] }
aws-sdk-bedrockruntime = { version = "1.155", default-features = false, features = ["rt-tokio"] }
aws-smithy-http-client = { version = "1.5", default-features = false, features = ["rustls-ring"] }
# The TLS stack of the rest of the binary, instead of a second one.
gcp_auth = { version = "0.12", default-features = false, features = ["ring"] }
aws-smithy-types = "1.9"

# Binary plumbing
mimalloc = "0.1"
tracing = "0.1"
# The log file is plain text: without `ansi`, which brings a colour library for nothing.
tracing-subscriber = { version = "0.3", default-features = false, features = [
    "fmt",
    "smallvec",
    "std",
    "tracing-log",
] }
tracing-appender = "0.2"

# Test (and the screen of a program in a terminal)
wiremock = "0.6"
insta = "1.49"
assert_cmd = "2"
tempfile = "3"
vt100 = "0.18"
# A certificate and a TLS server for the handshake tests of `azazel_ai::tls`.
rcgen = "0.14"
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "deny"

# The binary is mostly glue around I/O. It is built for size and optimised as one unit, which
# removes duplicated instantiations, and so are its dependencies, the C libraries among them
# (`/O1`, `-Os`): SQLite, the Luau compiler and VM, the shell grammar and its parser, ring's C
# parts. Full optimisation is kept where the time goes, in the packages listed below; the rest
# costs about 6 MB at `opt-level = 3` and none of it is on a path where that shows. A package
# earns a place on the list with a measurement. `cargo xtask bench-startup` holds the result to
# its limits.
[profile.release]
opt-level = "s"
lto = "fat"
codegen-units = 1
strip = true
panic = "unwind" # a panic in one agent or tool task must fail that task, not the whole team

[profile.release.package]
# Drawing: the renderer, the width and the boundaries of text, the screen of a terminal.
azazel-tui = { opt-level = 3 }
unicode-width = { opt-level = 3 }
unicode-segmentation = { opt-level = 3 }
vt100 = { opt-level = 3 }
vte = { opt-level = 3 }
# Markdown and syntax highlighting.
pulldown-cmark = { opt-level = 3 }
syntect = { opt-level = 3 }
onig = { opt-level = 3 }
onig_sys = { opt-level = 3 }
# Regular expressions.
regex = { opt-level = 3 }
regex-automata = { opt-level = 3 }
regex-syntax = { opt-level = 3 }
aho-corasick = { opt-level = 3 }
memchr = { opt-level = 3 }
# JSON.
serde_json = { opt-level = 3 }
serde_core = { opt-level = 3 }
itoa = { opt-level = 3 }
zmij = { opt-level = 3 }
# The async runtime.
tokio = { opt-level = 3 }
mio = { opt-level = 3 }
bytes = { opt-level = 3 }
parking_lot = { opt-level = 3 }
parking_lot_core = { opt-level = 3 }
# The allocator.
mimalloc = { opt-level = 3 }
libmimalloc-sys = { opt-level = 3 }

[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 2 # third-party hot code (serde_json, syntect, image, unicode-*) stays fast in dev builds
