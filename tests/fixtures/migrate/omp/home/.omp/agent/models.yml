providers:
  gate:
    baseUrl: https://gate.example.com/v1
    api: openai-completions
    auth: apiKey
    apiKey: "test-key-gate"
    models:
      - id: small-chat
        name: Small Chat
        contextWindow: 128000
        maxTokens: 16000
        input: [text]
      - id: big-responses
        name: Big Responses
        api: openai-responses
        reasoning: true
        thinking: { mode: effort, efforts: [low, medium, high, xhigh] }
        contextWindow: 1000000
        maxTokens: 128000
        cost: { input: 2.5, output: 10, cacheRead: 0.25 }
