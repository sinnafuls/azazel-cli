[package]
name = "docs-check"
description = "Compares what the code registers with what the docs list; run as `cargo xtask docs-check`"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[lints]
workspace = true

# A package of its own, so that the other tasks of `xtask` (and the release build they start) do
# not wait for a debug build of the whole program: this one asks the program itself for what it
# registers.
[dependencies]
anyhow.workspace = true
azazel-cli.workspace = true
azazel-core.workspace = true
azazel-protocol.workspace = true
azazel-tui.workspace = true
clap.workspace = true
serde_json.workspace = true
tempfile.workspace = true
tokio.workspace = true
xtask = { path = ".." }
